name: Bygg STÄLLVERKET för macOS, Windows och Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # behövs för att skapa releaser

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Testa motorn
        run: |
          c++ -std=c++17 -O2 -Isrc tests/motor_test.cpp -o motor_test
          ./motor_test

      - name: Konfigurera
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Bygg
        run: cmake --build build --config Release -j 3

      - name: Paketera
        run: |
          ART=build/Stallverket_artefacts/Release
          mkdir -p dist/STALLVERKET
          cp -R "$ART/VST3/STALLVERKET.vst3" dist/STALLVERKET/
          cp -R "$ART/AU/STALLVERKET.component" dist/STALLVERKET/
          cp scripts/installera.command dist/STALLVERKET/
          cp README.md dist/STALLVERKET/LASMIG.md
          chmod +x dist/STALLVERKET/installera.command
          for b in dist/STALLVERKET/STALLVERKET.vst3 dist/STALLVERKET/STALLVERKET.component; do
            codesign --force --deep --sign - "$b"
          done
          cd dist && ditto -c -k --keepParent STALLVERKET STALLVERKET-macOS.zip

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: STALLVERKET-macOS
          path: dist/STALLVERKET-macOS.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Bygg
        run: cmake --build build --config Release --parallel 4

      - name: Paketera
        shell: pwsh
        run: |
          $ART = "build/Stallverket_artefacts/Release"
          New-Item -ItemType Directory -Force dist/STALLVERKET | Out-Null
          Copy-Item -Recurse "$ART/VST3/STALLVERKET.vst3" dist/STALLVERKET/
          Copy-Item scripts/installera.bat dist/STALLVERKET/
          Copy-Item README.md dist/STALLVERKET/LASMIG.md
          Compress-Archive -Path dist/STALLVERKET -DestinationPath dist/STALLVERKET-Windows.zip

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: STALLVERKET-Windows
          path: dist/STALLVERKET-Windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installera beroenden
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Konfigurera
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bygg
        run: cmake --build build --config Release --target Stallverket_VST3 Stallverket_LV2 -j 4

      - name: Paketera
        run: |
          mkdir -p dist/STALLVERKET
          cp -R build/Stallverket_artefacts/Release/VST3/*.vst3 dist/STALLVERKET/
          cp -R build/Stallverket_artefacts/Release/LV2/*.lv2 dist/STALLVERKET/
          cp scripts/installera-linux.sh dist/STALLVERKET/
          chmod +x dist/STALLVERKET/installera-linux.sh
          cd dist && zip -r -y STALLVERKET-Linux.zip STALLVERKET

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: STALLVERKET-Linux
          path: dist/STALLVERKET-Linux.zip

  # Varje bygge på main blir en release:
  # .../releases/latest/download/STALLVERKET-macOS.zip ger alltid senaste versionen.
  release:
    if: github.event_name == 'push'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Skapa release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('bygge-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('STÄLLVERKET bygge {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Ladda ner STALLVERKET-macOS.zip (Mac), STALLVERKET-Windows.zip eller STALLVERKET-Linux.zip. Installera enligt README."
          files: |
            dist/STALLVERKET-macOS.zip
            dist/STALLVERKET-Windows.zip
            dist/STALLVERKET-Linux.zip
